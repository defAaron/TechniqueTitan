# mlx-lm 0.30.2 LoRA config (spec §1.1, §6.2). Use: mlx_lm.lora -c data/coach/lora_config.yaml
# Rank / alpha / dropout / target modules are only settable here at this version.
model: mlx-community/Qwen2.5-0.5B-Instruct-4bit
train: true
data: data/coach/split
fine_tune_type: lora
optimizer: adamw
mask_prompt: true
# Qwen2.5-0.5B has 24 decoder layers; -1 adapts every attention block.
num_layers: -1
batch_size: 4
iters: 600
learning_rate: 1.0e-4
max_seq_length: 512
seed: 0
adapter_path: data/coach/adapters
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj]
  rank: 8
  # mlx-lm scale = alpha / rank = 16 / 8
  scale: 2.0
  dropout: 0.05
